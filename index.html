<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GREEN-API Test Page</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f4ff',
                            100: '#e0e9ff',
                            500: '#667eea',
                            600: '#5568d3',
                            700: '#764ba2',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Custom Styles -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .btn-hover {
            transition: all 0.3s ease;
        }
        
        .btn-hover:hover {
            transform: translateY(-2px);
        }
        
        .btn-hover:active {
            transform: translateY(0);
        }
        
        .response-textarea {
            font-family: 'Courier New', 'Monaco', 'Menlo', monospace;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen py-5 px-4">
    <div class="container mx-auto max-w-7xl">
        <div class="bg-white rounded-3xl shadow-2xl p-6 md:p-8">
            <!-- Header -->
            <div class="text-center mb-6">
                <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-2">
                    <span class="inline-flex items-center gap-2">
                         
                        GREEN-API Test Page
                    </span>
                </h1>
            </div>

            <!-- Alerts -->
            <div id="errorMessage" class="hidden bg-red-50 border-l-4 border-red-500 text-red-700 p-4 rounded-lg mb-4" role="alert">
                <div class="flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
                    </svg>
                    <span id="errorText" class="font-medium"></span>
                </div>
            </div>

            <div id="successMessage" class="hidden bg-green-50 border-l-4 border-green-500 text-green-700 p-4 rounded-lg mb-4" role="alert">
                <div class="flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                    </svg>
                    <span id="successText" class="font-medium"></span>
                </div>
            </div>

            <!-- Main Layout: Two Columns -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- Left Column: Inputs and Actions -->
                <div class="space-y-6">
                    <!-- Credentials Section -->
                    <div class="space-y-4">
                        <h2 class="text-lg font-semibold text-gray-800">Credentials</h2>
                        <div>
                            <label for="idInstance" class="block text-sm font-semibold text-gray-700 mb-2">
                                IdInstance
                            </label>
                            <input 
                                type="text" 
                                class="w-full px-4 py-2 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-200 transition-colors" 
                                id="idInstance" 
                                placeholder="Enter idInstance"
                                autocomplete="off"
                            >
                        </div>
                        <div>
                            <label for="apiToken" class="block text-sm font-semibold text-gray-700 mb-2">
                                ApiTokenInstance
                            </label>
                            <input 
                                type="text" 
                                class="w-full px-4 py-2 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-200 transition-colors" 
                                id="apiToken" 
                                placeholder="Enter ApiTokenInstance"
                                autocomplete="off"
                            >
                        </div>
                    </div>

                    <!-- Settings Buttons -->
                    <div class="space-y-4">
                        <h2 class="text-lg font-semibold text-gray-800">Settings</h2>
                        <div class="grid grid-cols-2 gap-3">
                            <button 
                                type="button" 
                                class="btn-hover bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:shadow-lg" 
                                id="btnGetSettings"
                            >
                                getSettings
                            </button>
                            <button 
                                type="button" 
                                class="btn-hover bg-cyan-600 hover:bg-cyan-700 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:shadow-lg" 
                                id="btnGetStateInstance"
                            >
                                getStateInstance
                            </button>
                        </div>
                    </div>

                    <!-- Send Message Section -->
                    <div class="space-y-4">
                        <h2 class="text-lg font-semibold text-gray-800">Send Message</h2>
                        <div>
                            <label for="messageChatId" class="block text-sm font-semibold text-gray-700 mb-2">
                                Phone Number
                            </label>
                            <input 
                                type="text" 
                                id="messageChatId"
                                class="w-full px-4 py-2 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-200 transition-colors"
                                placeholder="77771234567 or 77771234567@c.us"
                                autocomplete="off"
                            >
                        </div>
                        <div>
                            <label for="messageText" class="block text-sm font-semibold text-gray-700 mb-2">
                                Message
                            </label>
                            <textarea 
                                id="messageText"
                                rows="4"
                                class="w-full px-4 py-2 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-200 transition-colors resize-none"
                                placeholder="Enter your message here..."
                            ></textarea>
                        </div>
                        <button 
                            type="button" 
                            class="btn-hover bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:shadow-lg w-full" 
                            id="btnSendMessage"
                        >
                            sendMessage
                        </button>
                    </div>

                    <!-- Send File Section -->
                    <div class="space-y-4">
                        <h2 class="text-lg font-semibold text-gray-800">Send File</h2>
                        <div>
                            <label for="fileChatId" class="block text-sm font-semibold text-gray-700 mb-2">
                                Phone Number
                            </label>
                            <input 
                                type="text" 
                                id="fileChatId"
                                class="w-full px-4 py-2 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-200 transition-colors"
                                placeholder="77771234567 or 77771234567@c.us"
                                autocomplete="off"
                            >
                        </div>
                        <div>
                            <label for="fileUrl" class="block text-sm font-semibold text-gray-700 mb-2">
                                File URL
                            </label>
                            <input 
                                type="url" 
                                id="fileUrl"
                                class="w-full px-4 py-2 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-200 transition-colors"
                                placeholder="https://example.com/file.pdf"
                                autocomplete="off"
                            >
                        </div>
                        <button 
                            type="button" 
                            class="btn-hover bg-yellow-600 hover:bg-yellow-700 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:shadow-lg w-full" 
                            id="btnSendFileByUrl"
                        >
                            sendFileByUrl
                        </button>
                    </div>
                </div>

                <!-- Right Column: Response -->
                <div class="space-y-4">
                    <h2 class="text-lg font-semibold text-gray-800">Response:</h2>
                    <div class="bg-gray-50 rounded-xl border-2 border-gray-200 overflow-hidden h-full">
                        <textarea 
                            id="response" 
                            class="response-textarea w-full px-4 py-4 bg-gray-50 border-0 focus:outline-none focus:ring-0 text-sm h-full min-h-[600px]" 
                            readonly 
                            placeholder="Method call results will be displayed here..."
                        ></textarea>
                    </div>
                </div>
            </div>

            <!-- Loading Indicator -->
            <div id="loading" class="hidden text-center mt-4">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-primary-500"></div>
                <p class="mt-2 text-gray-600 font-medium">Loading...</p>
            </div>

            <!-- Footer -->
            <div class="text-center mt-6 pt-4 border-t border-gray-200">
                <p class="text-gray-500 text-sm">
                    GREEN API © 2025
                </p>
            </div>
        </div>
    </div>

    <!-- Application JavaScript -->
    <script src="js/app.js"></script>
</body>
</html>
